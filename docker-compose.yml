# Local development services:    docker compose up -d
# Everything, including the API:  docker compose --profile app up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dg_api
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dg_api']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  migrate:
    profiles: ['app']
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: &api-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dg_api
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
    depends_on: { postgres: { condition: service_healthy } }

  api:
    profiles: ['app']
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ['app']
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
